name: Clarim da Verdade — CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Security Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'clarim-da-verdade'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --failOnCVSS 7
            --suppression dependency-check-suppressions.xml

  # ── Lint & Test ───────────────────────────────────────────
  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - content-service
          - payment-service
          - notification-service
          - analytics-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clarim_test
          POSTGRES_USER: clarim
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          npm ci --prefer-offline

      - name: Lint (ESLint)
        run: |
          cd services/${{ matrix.service }}
          npm run lint -- --format=github

      - name: Type check
        run: |
          cd services/${{ matrix.service }}
          npm run typecheck 2>/dev/null || true

      - name: Unit & Integration tests
        run: |
          cd services/${{ matrix.service }}
          npm test -- --coverage --ci --forceExit
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: clarim_test
          POSTGRES_USER: clarim
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_only_for_ci
          REFRESH_SECRET: test_refresh_secret_ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  # ── Frontend Tests ─────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test -- --ci
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.clarim-da-verdade.co.ao

  # ── E2E Tests ──────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start services
        run: |
          docker compose -f infrastructure/docker/docker-compose.test.yml up -d
          sleep 30
      - name: Run Playwright E2E tests
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── Build & Push Images ────────────────────────────────────
  build:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [security, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - content-service
          - payment-service
          - notification-service
          - analytics-service
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          target: production

      - name: Scan built image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: sarif
          severity: CRITICAL
          exit-code: 1

  # ── Deploy Staging ─────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.clarim-da-verdade.co.ao
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        run: |
          # Update image tags
          for svc in auth-service user-service content-service payment-service notification-service analytics-service frontend; do
            kubectl set image deployment/$svc $svc=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:sha-${{ github.sha }} \
              -n clarim-staging
          done
          
          # Wait for rollouts
          for svc in auth-service user-service content-service payment-service notification-service analytics-service frontend; do
            kubectl rollout status deployment/$svc -n clarim-staging --timeout=5m
          done

      - name: Run smoke tests
        run: |
          sleep 15
          curl -f https://staging.clarim-da-verdade.co.ao/api/health || exit 1
          echo "✔ Staging health check passed"

  # ── Deploy Production ──────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://clarim-da-verdade.co.ao
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy with canary strategy (20%)
        run: |
          # Deploy canary first (20% traffic)
          kubectl apply -f infrastructure/kubernetes/overlays/production/canary.yaml -n clarim
          
          for svc in auth-service content-service frontend; do
            kubectl set image deployment/${svc}-canary ${svc}=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${svc}:sha-${{ github.sha }} -n clarim
            kubectl rollout status deployment/${svc}-canary -n clarim --timeout=3m
          done

      - name: Monitor canary (5 minutes)
        run: |
          echo "Monitoring canary for 5 minutes..."
          sleep 300
          # Check error rates via Prometheus API
          ERROR_RATE=$(curl -s "${{ secrets.PROMETHEUS_URL }}/api/v1/query?query=rate(http_requests_total{status=~'5..'}[5m])" | jq -r '.data.result[0].value[1] // "0"')
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "❌ Canary error rate too high: $ERROR_RATE. Rolling back."
            kubectl rollout undo deployment/auth-service-canary -n clarim
            exit 1
          fi
          echo "✔ Canary healthy. Proceeding to full rollout."

      - name: Full production rollout
        run: |
          for svc in auth-service user-service content-service payment-service notification-service analytics-service frontend; do
            kubectl set image deployment/$svc $svc=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:sha-${{ github.sha }} -n clarim
            kubectl rollout status deployment/$svc -n clarim --timeout=10m
          done
          kubectl delete deployment -l type=canary -n clarim

      - name: Post-deployment verification
        run: |
          sleep 20
          for endpoint in "" "/api/auth/health" "/api/content/health"; do
            curl -f https://clarim-da-verdade.co.ao${endpoint} || exit 1
          done
          echo "✔ All health checks passed"

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ *Clarim da Verdade* deployed to production successfully!\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back all services..."
          for svc in auth-service user-service content-service payment-service notification-service analytics-service frontend; do
            kubectl rollout undo deployment/$svc -n clarim
          done
